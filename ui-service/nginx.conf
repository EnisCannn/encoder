server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Angular her rotayi prerender ettigi icin /jobs/index.html gibi ayri ayri
    # HTML dosyalari var. Bunlarin hicbiri cache'lenmemeli: cache'lenirse
    # tarayici eski build'in bundle adini (main-XXXX.js) tutar ve yeni surum
    # deploy edilse bile sayfa eski haliyle acilir.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

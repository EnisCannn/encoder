<!-- Giris yapilmadiginda kabuk cizilmez; login sayfasi tam ekran acilir -->
<div class="shell" *ngIf="isLoggedIn(); else bare">
  <aside class="sidebar">
    <div class="brand">
      <mat-icon>construction</mat-icon>
      <div class="brand-text">
        <span class="brand-name">Video Encoder</span>
        <span class="brand-sub">Yönetim Paneli</span>
      </div>
    </div>

    <nav class="nav">
      <a *ngFor="let item of navItems()"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="user-box">
      <div class="avatar">{{ currentUser()?.username?.charAt(0)?.toUpperCase() }}</div>
      <div class="user-text">
        <span class="user-name">{{ currentUser()?.username }}</span>
        <span class="user-role">{{ roleLabels[currentUser()?.role || ''] || currentUser()?.role }}</span>
      </div>
      <button class="logout" (click)="logout()" matTooltip="Çıkış yap">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<ng-template #bare>
  <router-outlet></router-outlet>
</ng-template>

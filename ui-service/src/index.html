<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UiService</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Tema Angular acilmadan once yaziliyor. Bunu bilesen icinde yapmak iki
         soruna yol aciyordu: acilista koyu tema bir an gorunup aydinliga
         donuyordu ve tercih bazi sayfa yuklemelerinde hic uygulanmiyordu. -->
    <script>
      try {
        if (localStorage.getItem("encoder.theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {
        /* gizli sekmede localStorage kapali olabilir; koyu temayla devam */
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
